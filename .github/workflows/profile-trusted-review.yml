name: Trusted profile review

on:
  pull_request_target:
    types:
      - edited
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  trusted-profile:
    name: Check trusted profile PR
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out trusted base repository
        uses: actions/checkout@v6

      - name: Collect changed files
        uses: actions/github-script@v9
        env:
          PROFILE_FILES_JSON: ${{ runner.temp }}/profile-files.json
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const fs = require('node:fs');
            fs.writeFileSync(process.env.PROFILE_FILES_JSON, JSON.stringify(files, null, 2));

      - name: Verify trusted profile content
        id: trusted_check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_PROFILE_COMMENT: ${{ runner.temp }}/trusted-profile-comment.md
        run: >-
          node scripts/profiles/trusted-pr-check.mjs
          --event "$GITHUB_EVENT_PATH"
          --files "$RUNNER_TEMP/profile-files.json"
          --comment-output "$TRUSTED_PROFILE_COMMENT"

      - name: Create credits assistant token for comments
        id: credits-assistant-comment-token
        if: steps.trusted_check.outcome == 'failure' || steps.trusted_check.outcome == 'success'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SITCON_CREDITS_ASSISTANT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SITCON_CREDITS_ASSISTANT_APP_PRIVATE_KEY }}
          owner: sitcon-tw
          repositories: credits-profiles
          permission-issues: write

      - name: Comment trusted profile checklist reminder
        if: steps.trusted_check.outcome == 'failure'
        uses: actions/github-script@v9
        env:
          TRUSTED_PROFILE_COMMENT: ${{ runner.temp }}/trusted-profile-comment.md
        with:
          github-token: ${{ steps.credits-assistant-comment-token.outputs.token }}
          script: |
            const fs = require('node:fs');
            const marker = '<!-- sitcon-credits-profile-trusted-checklist -->';
            const commentBotLogins = new Set(['github-actions[bot]', 'sitcon-credits[bot]']);
            const bodyPath = process.env.TRUSTED_PROFILE_COMMENT;
            if (!fs.existsSync(bodyPath)) {
              return;
            }

            const body = fs.readFileSync(bodyPath, 'utf8');
            const pr = context.payload.pull_request;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              commentBotLogins.has(comment.user?.login) &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });

      - name: Clear trusted profile checklist reminder
        if: steps.trusted_check.outcome == 'success'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.credits-assistant-comment-token.outputs.token }}
          script: |
            const marker = '<!-- sitcon-credits-profile-trusted-checklist -->';
            const commentBotLogins = new Set(['github-actions[bot]', 'sitcon-credits[bot]']);
            const pr = context.payload.pull_request;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            for (const comment of comments) {
              if (
                commentBotLogins.has(comment.user?.login) &&
                comment.body?.includes(marker)
              ) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

      - name: Fail trusted profile content
        if: steps.trusted_check.outcome == 'failure'
        run: exit 1

      - name: Create credits assistant token
        id: credits-assistant-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SITCON_CREDITS_ASSISTANT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SITCON_CREDITS_ASSISTANT_APP_PRIVATE_KEY }}
          owner: sitcon-tw
          repositories: credits
          permission-contents: write

      - name: Dispatch canonical appearances review
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.credits-assistant-token.outputs.token }}
          script: |
            const pr = context.payload.pull_request;
            if (pr.state !== 'open') {
              core.warning(`PR #${pr.number} is ${pr.state}; skipping profile review dispatch.`);
              return;
            }

            await github.rest.repos.createDispatchEvent({
              owner: 'sitcon-tw',
              repo: 'credits',
              event_type: 'review-profile-pr',
              client_payload: {
                source_repository: `${context.repo.owner}/${context.repo.repo}`,
                pull_number: pr.number,
                head_sha: pr.head.sha,
              },
            });
