name: CI

on:
  pull_request:
    paths-ignore:
      - 'profiles/*.json'
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate profile data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Validate profiles
        run: pnpm profiles:validate

      - name: Save PR metadata
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/profile-pr"
          printf '%s\n' '${{ github.event.pull_request.number }}' > "$RUNNER_TEMP/profile-pr/number"

      - name: Upload PR metadata
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: profile-pr-metadata
          path: ${{ runner.temp }}/profile-pr/number
          retention-days: 1
