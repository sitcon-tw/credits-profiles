name: Sync credits profile data

on:
  push:
    branches:
      - master
    paths:
      - 'profiles/*.json'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  dispatch:
    name: Request people sheet sync and Pages rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Resolve merged profile PR
        id: merged-profile
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== 'push') {
              core.setOutput('pull_number', '');
              core.setOutput('username', '');
              return;
            }

            let merged = null;
            for (let attempt = 0; attempt < 6; attempt += 1) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });
              merged = associated.data.find((pr) => pr.merged_at) || null;
              if (merged) {
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            if (!merged) {
              const commit = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
              });
              const match = commit.data.commit.message.match(/\(#(\d+)\)\s*$/m);
              if (match) {
                const pull = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: Number(match[1]),
                });
                if (pull.data.merged_at && pull.data.merge_commit_sha === context.sha) {
                  merged = pull.data;
                }
              }
            }
            if (!merged) {
              core.setOutput('pull_number', '');
              core.setOutput('username', '');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: merged.number,
              per_page: 100,
            });
            const usernames = new Set();
            for (const file of files) {
              if (file.status === 'removed' || file.status === 'renamed') {
                continue;
              }
              const match = /^profiles\/([^/_][^/]*)\.json$/.exec(file.filename);
              if (match) {
                usernames.add(match[1]);
              }
            }
            if (usernames.size !== 1) {
              core.setOutput('pull_number', '');
              core.setOutput('username', '');
              return;
            }

            core.setOutput('pull_number', String(merged.number));
            core.setOutput('username', [...usernames][0]);

      - name: Create credits assistant token
        id: credits-assistant-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SITCON_CREDITS_ASSISTANT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SITCON_CREDITS_ASSISTANT_APP_PRIVATE_KEY }}
          owner: sitcon-tw
          repositories: credits
          permission-contents: write

      - name: Dispatch credits sync workflow
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.credits-assistant-token.outputs.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'sitcon-tw',
              repo: 'credits',
              event_type: 'sync-people-from-profiles',
              client_payload: {
                source_repository: `${context.repo.owner}/${context.repo.repo}`,
                source_sha: context.sha,
                source_run_id: context.runId,
              },
            });

      - name: Dispatch credits Pages rebuild workflow
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.credits-assistant-token.outputs.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'sitcon-tw',
              repo: 'credits',
              event_type: 'rebuild-pages-from-profiles',
              client_payload: {
                source_repository: `${context.repo.owner}/${context.repo.repo}`,
                source_sha: context.sha,
                source_run_id: context.runId,
                profile_pull_number: '${{ steps.merged-profile.outputs.pull_number }}',
                profile_username: '${{ steps.merged-profile.outputs.username }}',
              },
            });
