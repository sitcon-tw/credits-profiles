name: Sync credits people helper

on:
  push:
    branches:
      - master
    paths:
      - 'profiles/*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Request people sheet sync
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create credits assistant token
        id: credits-assistant-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SITCON_CREDITS_ASSISTANT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SITCON_CREDITS_ASSISTANT_APP_PRIVATE_KEY }}
          owner: sitcon-tw
          repositories: credits
          permission-contents: write

      - name: Dispatch credits sync workflow
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.credits-assistant-token.outputs.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'sitcon-tw',
              repo: 'credits',
              event_type: 'sync-people-from-profiles',
              client_payload: {
                source_repository: `${context.repo.owner}/${context.repo.repo}`,
                source_sha: context.sha,
                source_run_id: context.runId,
              },
            });
