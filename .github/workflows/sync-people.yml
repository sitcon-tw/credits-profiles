name: Sync credits people helper

on:
  push:
    branches:
      - master
    paths:
      - 'profiles/*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Request people sheet sync
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch credits sync workflow
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.CREDITS_SYNC_TOKEN }}
          script: |
            if (!process.env.CREDITS_SYNC_TOKEN) {
              core.setFailed('CREDITS_SYNC_TOKEN repository secret is required to dispatch sitcon-tw/credits.');
              return;
            }

            await github.rest.repos.createDispatchEvent({
              owner: 'sitcon-tw',
              repo: 'credits',
              event_type: 'sync-people-from-profiles',
              client_payload: {
                source_repository: `${context.repo.owner}/${context.repo.repo}`,
                source_sha: context.sha,
                source_run_id: context.runId,
              },
            });
        env:
          CREDITS_SYNC_TOKEN: ${{ secrets.CREDITS_SYNC_TOKEN }}
