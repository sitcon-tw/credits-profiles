name: Profile issue request

on:
  issues:
    types:
      - opened
      - edited
      - reopened

permissions:
  contents: read
  issues: read

concurrency:
  group: profile-issue-request-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  create-pr:
    name: Create profile PR from issue form
    if: >-
      contains(github.event.issue.labels.*.name, 'profile-request') &&
      (github.event.action != 'edited' || contains(toJSON(github.event.changes), '"body"'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out trusted base repository
        uses: actions/checkout@v6

      - name: Build profile PR payload
        id: build
        continue-on-error: true
        env:
          PROFILE_REQUEST_METADATA: ${{ runner.temp }}/profile-request-metadata.json
          PROFILE_REQUEST_PROFILE: ${{ runner.temp }}/profile-request-profile.json
          PROFILE_REQUEST_PR_BODY: ${{ runner.temp }}/profile-request-pr-body.md
          PROFILE_REQUEST_COMMENT: ${{ runner.temp }}/profile-request-comment.md
        run: >-
          node scripts/profiles/issue-form-to-profile-pr.mjs
          --event "$GITHUB_EVENT_PATH"
          --metadata-output "$PROFILE_REQUEST_METADATA"
          --profile-output "$PROFILE_REQUEST_PROFILE"
          --pr-body-output "$PROFILE_REQUEST_PR_BODY"
          --comment-output "$PROFILE_REQUEST_COMMENT"

      - name: Create credits assistant token
        id: credits-assistant-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SITCON_CREDITS_ASSISTANT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SITCON_CREDITS_ASSISTANT_APP_PRIVATE_KEY }}
          owner: sitcon-tw
          repositories: |
            credits-profiles
            credits
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Update profile request issue title
        if: steps.build.outcome == 'success'
        uses: actions/github-script@v9
        env:
          PROFILE_REQUEST_METADATA: ${{ runner.temp }}/profile-request-metadata.json
        with:
          github-token: ${{ steps.credits-assistant-token.outputs.token }}
          script: |
            const fs = require('node:fs');
            const metadata = JSON.parse(fs.readFileSync(process.env.PROFILE_REQUEST_METADATA, 'utf8'));
            const title = `[個人公開資料] ${metadata.username}`;
            if (context.payload.issue.title !== title) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                title,
              });
            } else {
              core.info(`Profile request issue title is already ${title}`);
            }

      - name: Comment profile request problem
        if: steps.build.outcome == 'failure'
        uses: ./.github/actions/sticky-comment
        with:
          github-token: ${{ steps.credits-assistant-token.outputs.token }}
          marker: '<!-- sitcon-credits-profile-request -->'
          mode: upsert
          body-file: ${{ runner.temp }}/profile-request-comment.md
          issue-number: ${{ github.event.issue.number }}

      - name: Stop after invalid request
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Create or update profile PR
        id: pr
        uses: actions/github-script@v9
        env:
          PROFILE_REQUEST_METADATA: ${{ runner.temp }}/profile-request-metadata.json
          PROFILE_REQUEST_PROFILE: ${{ runner.temp }}/profile-request-profile.json
          PROFILE_REQUEST_PR_BODY: ${{ runner.temp }}/profile-request-pr-body.md
        with:
          github-token: ${{ steps.credits-assistant-token.outputs.token }}
          script: |
            const fs = require('node:fs');
            const metadata = JSON.parse(fs.readFileSync(process.env.PROFILE_REQUEST_METADATA, 'utf8'));
            const profileText = fs.readFileSync(process.env.PROFILE_REQUEST_PROFILE, 'utf8');
            const prBody = fs.readFileSync(process.env.PROFILE_REQUEST_PR_BODY, 'utf8');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = context.payload.repository.default_branch;

            const baseRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${base}`,
            });

            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${metadata.branchName}`,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${metadata.branchName}`,
                sha: baseRef.data.object.sha,
              });
            }

            let existingFileSha;
            let existingProfileText;
            try {
              const existingFile = await github.rest.repos.getContent({
                owner,
                repo,
                path: metadata.profilePath,
                ref: metadata.branchName,
              });
              if (!Array.isArray(existingFile.data)) {
                existingFileSha = existingFile.data.sha;
                existingProfileText = Buffer.from(
                  existingFile.data.content,
                  existingFile.data.encoding || 'base64',
                ).toString('utf8');
              }
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            if (existingProfileText === profileText) {
              core.info(`${metadata.profilePath} is already up to date on ${metadata.branchName}`);
            } else {
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path: metadata.profilePath,
                branch: metadata.branchName,
                message: `chore: update ${metadata.username} profile from issue #${context.issue.number}`,
                content: Buffer.from(profileText, 'utf8').toString('base64'),
                sha: existingFileSha,
              });
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              head: `${owner}:${metadata.branchName}`,
              base,
              per_page: 100,
            });

            let pull = pulls[0];
            if (pull) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pull.number,
                title: metadata.prTitle,
                body: prBody,
              });
            } else {
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${base}...${metadata.branchName}`,
              });
              if (existingProfileText === profileText && comparison.data.ahead_by === 0) {
                if (metadata.hasSiteClaims) {
                  await github.rest.repos.createDispatchEvent({
                    owner,
                    repo: 'credits',
                    event_type: 'review-profile-claim-issue',
                    client_payload: {
                      source_repository: `${owner}/${repo}`,
                      issue_number: context.issue.number,
                      username: metadata.username,
                    },
                  });
                  core.info(`${metadata.branchName} has no profile changes; dispatched claim-only issue review`);
                  return;
                }
                core.info(`${metadata.branchName} has no profile changes; no pull request is needed`);
                return;
              }
              const created = await github.rest.pulls.create({
                owner,
                repo,
                title: metadata.prTitle,
                head: metadata.branchName,
                base,
                body: prBody,
                maintainer_can_modify: true,
              });
              pull = created.data;
            }

            core.setOutput('number', String(pull.number));
            core.setOutput('url', pull.html_url);
