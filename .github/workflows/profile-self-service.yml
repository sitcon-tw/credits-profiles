name: Profile self-service guard

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  ownership:
    name: Check profile PR scope
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out trusted base repository
        uses: actions/checkout@v6

      - name: Collect changed files
        uses: actions/github-script@v9
        env:
          PROFILE_FILES_JSON: ${{ runner.temp }}/profile-files.json
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const fs = require('node:fs');
            fs.writeFileSync(process.env.PROFILE_FILES_JSON, JSON.stringify(files, null, 2));

      - name: Collect linked profile request issue
        uses: actions/github-script@v9
        env:
          PROFILE_SOURCE_ISSUE_JSON: ${{ runner.temp }}/profile-source-issue.json
        with:
          script: |
            const fs = require('node:fs');
            const pr = context.payload.pull_request;
            const match = pr.body?.match(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/i);
            if (!match) {
              fs.writeFileSync(process.env.PROFILE_SOURCE_ISSUE_JSON, 'null');
              return;
            }

            const issue_number = Number(match[1]);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            if (!issue.labels.some((label) => label.name === 'profile-request')) {
              fs.writeFileSync(process.env.PROFILE_SOURCE_ISSUE_JSON, 'null');
              return;
            }
            fs.writeFileSync(process.env.PROFILE_SOURCE_ISSUE_JSON, JSON.stringify(issue, null, 2));

      - name: Verify self-service profile scope
        id: scope_check
        continue-on-error: true
        env:
          PROFILE_SCOPE_COMMENT: ${{ runner.temp }}/profile-scope-comment.md
        run: >-
          node scripts/profiles/self-service-guard.mjs
          --event="$GITHUB_EVENT_PATH"
          --files="$RUNNER_TEMP/profile-files.json"
          --source-issue="$RUNNER_TEMP/profile-source-issue.json"
          --comment-output="$PROFILE_SCOPE_COMMENT"

      - name: Create credits assistant token
        id: credits-assistant-token
        if: steps.scope_check.outcome == 'failure' || steps.scope_check.outcome == 'success'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SITCON_CREDITS_ASSISTANT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SITCON_CREDITS_ASSISTANT_APP_PRIVATE_KEY }}
          owner: sitcon-tw
          repositories: credits-profiles
          permission-issues: write

      - name: Comment profile scope reminder
        if: steps.scope_check.outcome == 'failure'
        uses: actions/github-script@v9
        env:
          PROFILE_SCOPE_COMMENT: ${{ runner.temp }}/profile-scope-comment.md
        with:
          github-token: ${{ steps.credits-assistant-token.outputs.token }}
          script: |
            const fs = require('node:fs');
            const marker = '<!-- sitcon-credits-profile-scope-check -->';
            const commentBotLogins = new Set(['github-actions[bot]', 'sitcon-credits[bot]']);
            const bodyPath = process.env.PROFILE_SCOPE_COMMENT;
            if (!fs.existsSync(bodyPath)) {
              return;
            }

            const body = fs.readFileSync(bodyPath, 'utf8');
            const pr = context.payload.pull_request;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              commentBotLogins.has(comment.user?.login) &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });

      - name: Clear profile scope reminder
        if: steps.scope_check.outcome == 'success'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.credits-assistant-token.outputs.token }}
          script: |
            const marker = '<!-- sitcon-credits-profile-scope-check -->';
            const commentBotLogins = new Set(['github-actions[bot]', 'sitcon-credits[bot]']);
            const pr = context.payload.pull_request;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            for (const comment of comments) {
              if (
                commentBotLogins.has(comment.user?.login) &&
                comment.body?.includes(marker)
              ) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

      - name: Fail profile scope
        if: steps.scope_check.outcome == 'failure'
        run: exit 1
