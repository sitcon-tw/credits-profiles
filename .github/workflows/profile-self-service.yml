name: Profile self-service guard

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  ownership:
    name: Check profile PR scope
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify self-service profile scope
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);

            if (trustedAssociations.has(pr.author_association)) {
              core.info(`Trusted author association ${pr.author_association}; self-service guard does not restrict this PR.`);
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const author = pr.user.login.toLowerCase();
            const issues = [];
            const profileUsernames = new Set();

            for (const file of files) {
              const name = file.filename;

              if (file.status === 'removed') {
                issues.push(`${name}: profile removal requests require maintainer review.`);
                continue;
              }

              if (file.status === 'renamed') {
                issues.push(`${name}: profile renames require maintainer review.`);
                continue;
              }

              const match = /^profiles\/([^/]+)\.json$/.exec(name);
              if (!match) {
                issues.push(`${name}: self-service PRs may only change profiles/<github_username>.json.`);
                continue;
              }

              const username = match[1];
              if (username.startsWith('_')) {
                issues.push(`${name}: support/template files require maintainer review.`);
                continue;
              }

              profileUsernames.add(username.toLowerCase());
              if (username.toLowerCase() !== author) {
                issues.push(`${name}: filename username must match PR author ${pr.user.login}.`);
              }
            }

            if (files.length === 0) {
              issues.push('No changed files were found.');
            }

            if (profileUsernames.size === 0) {
              issues.push('Self-service PRs must change exactly one owned profile file.');
            }

            if (profileUsernames.size > 1) {
              issues.push('Self-service PRs may not change more than one GitHub username profile.');
            }

            if (issues.length > 0) {
              core.setFailed([
                'This PR needs maintainer review instead of the self-service path:',
                ...issues.map((issue) => `- ${issue}`),
              ].join('\n'));
            }
