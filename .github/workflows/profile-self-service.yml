name: Profile self-service guard

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read

jobs:
  ownership:
    name: Check profile PR scope
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out trusted base repository
        uses: actions/checkout@v6

      - name: Collect changed files
        uses: actions/github-script@v9
        env:
          PROFILE_FILES_JSON: ${{ runner.temp }}/profile-files.json
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const fs = require('node:fs');
            fs.writeFileSync(process.env.PROFILE_FILES_JSON, JSON.stringify(files, null, 2));

      - name: Verify self-service profile scope
        run: node scripts/profiles/self-service-guard.mjs --event="$GITHUB_EVENT_PATH" --files="$RUNNER_TEMP/profile-files.json"
