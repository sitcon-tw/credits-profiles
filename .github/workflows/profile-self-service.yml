name: Profile self-service guard

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  ownership:
    name: Check profile PR scope
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out trusted base repository
        uses: actions/checkout@v6

      - name: Collect changed files
        uses: actions/github-script@v9
        env:
          PROFILE_FILES_JSON: ${{ runner.temp }}/profile-files.json
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const fs = require('node:fs');
            fs.writeFileSync(process.env.PROFILE_FILES_JSON, JSON.stringify(files, null, 2));

      - name: Verify self-service profile scope
        id: scope_check
        continue-on-error: true
        env:
          PROFILE_SCOPE_COMMENT: ${{ runner.temp }}/profile-scope-comment.md
        run: >-
          node scripts/profiles/self-service-guard.mjs
          --event="$GITHUB_EVENT_PATH"
          --files="$RUNNER_TEMP/profile-files.json"
          --comment-output="$PROFILE_SCOPE_COMMENT"

      - name: Comment profile scope reminder
        if: steps.scope_check.outcome == 'failure'
        uses: actions/github-script@v9
        env:
          PROFILE_SCOPE_COMMENT: ${{ runner.temp }}/profile-scope-comment.md
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- sitcon-credits-profile-scope-check -->';
            const bodyPath = process.env.PROFILE_SCOPE_COMMENT;
            if (!fs.existsSync(bodyPath)) {
              return;
            }

            const body = fs.readFileSync(bodyPath, 'utf8');
            const pr = context.payload.pull_request;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });

      - name: Clear profile scope reminder
        if: steps.scope_check.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- sitcon-credits-profile-scope-check -->';
            const pr = context.payload.pull_request;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            for (const comment of comments) {
              if (
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker)
              ) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

      - name: Fail profile scope
        if: steps.scope_check.outcome == 'failure'
        run: exit 1
