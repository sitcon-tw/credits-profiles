name: Profile self-service guard

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  ownership:
    name: Check profile PR scope
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out trusted base repository
        uses: actions/checkout@v6

      - name: Collect profile PR context
        uses: ./.github/actions/collect-profile-pr-context

      - name: Verify self-service profile scope
        id: scope_check
        continue-on-error: true
        env:
          PROFILE_SCOPE_COMMENT: ${{ runner.temp }}/profile-scope-comment.md
        run: >-
          node scripts/profiles/self-service-guard.mjs
          --event="$GITHUB_EVENT_PATH"
          --files="$RUNNER_TEMP/profile-files.json"
          --source-issue="$RUNNER_TEMP/profile-source-issue.json"
          --comment-output="$PROFILE_SCOPE_COMMENT"

      - name: Create credits assistant token
        id: credits-assistant-token
        if: steps.scope_check.outcome == 'failure' || steps.scope_check.outcome == 'success'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SITCON_CREDITS_ASSISTANT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SITCON_CREDITS_ASSISTANT_APP_PRIVATE_KEY }}
          owner: sitcon-tw
          repositories: credits-profiles
          permission-issues: write

      - name: Comment profile scope reminder
        if: steps.scope_check.outcome == 'failure'
        uses: ./.github/actions/sticky-comment
        with:
          github-token: ${{ steps.credits-assistant-token.outputs.token }}
          marker: '<!-- sitcon-credits-profile-scope-check -->'
          mode: upsert
          body-file: ${{ runner.temp }}/profile-scope-comment.md
          issue-number: ${{ github.event.pull_request.number }}

      - name: Clear profile scope reminder
        if: steps.scope_check.outcome == 'success'
        uses: ./.github/actions/sticky-comment
        with:
          github-token: ${{ steps.credits-assistant-token.outputs.token }}
          marker: '<!-- sitcon-credits-profile-scope-check -->'
          mode: clear
          issue-number: ${{ github.event.pull_request.number }}

      - name: Fail profile scope
        if: steps.scope_check.outcome == 'failure'
        run: exit 1
