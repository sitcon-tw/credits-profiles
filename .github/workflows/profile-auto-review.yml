name: Profile auto review

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  dispatch:
    name: Request profile PR review
    if: >-
      ${{
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download PR metadata
        uses: actions/download-artifact@v4
        with:
          name: profile-pr-metadata
          path: ${{ runner.temp }}/profile-pr
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Dispatch canonical appearances review
        uses: actions/github-script@v9
        env:
          CREDITS_SYNC_TOKEN: ${{ secrets.CREDITS_SYNC_TOKEN }}
          PR_NUMBER_FILE: ${{ runner.temp }}/profile-pr/number
        with:
          github-token: ${{ secrets.CREDITS_SYNC_TOKEN }}
          script: |
            const fs = require('node:fs');

            if (!process.env.CREDITS_SYNC_TOKEN) {
              core.setFailed('CREDITS_SYNC_TOKEN repository secret is required.');
              return;
            }

            const numberText = fs.readFileSync(process.env.PR_NUMBER_FILE, 'utf8').trim();
            const pullNumber = Number(numberText);
            if (!Number.isInteger(pullNumber) || pullNumber <= 0) {
              core.setFailed(`Invalid PR number artifact: ${JSON.stringify(numberText)}`);
              return;
            }

            const workflowRun = context.payload.workflow_run;
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });

            if (pull.state !== 'open') {
              core.warning(`PR #${pullNumber} is ${pull.state}; skipping profile review dispatch.`);
              return;
            }

            if (pull.head.sha !== workflowRun.head_sha) {
              core.warning(`PR #${pullNumber} head is ${pull.head.sha}, but CI succeeded for ${workflowRun.head_sha}; skipping stale profile review dispatch.`);
              return;
            }

            await github.rest.repos.createDispatchEvent({
              owner: 'sitcon-tw',
              repo: 'credits',
              event_type: 'review-profile-pr',
              client_payload: {
                source_repository: `${context.repo.owner}/${context.repo.repo}`,
                pull_number: pullNumber,
                head_sha: workflowRun.head_sha,
              },
            });
