name: 新增或更新個人公開資料
description: 用表單填寫 SITCON Credits 願意公開顯示的個人公開資料
title: "新增或更新我的個人公開資料"
labels: ["profile-request"]
body:
  - type: markdown
    attributes:
      value: |
        這份表單送出後會建立公開的 GitHub issue。請只填你本人願意公開顯示在 SITCON Credits 的個人公開資料；不確定要不要公開的欄位可以留空。

        系統會使用你送出 issue 的 GitHub 帳號建立 `profiles/<GitHub username>.json`，並依照表單內容建立 Pull Request。這份表單不會自動修改歷史貢獻紀錄，也不會自動完成身份合併。
  - type: input
    id: display_name
    attributes:
      label: 公開顯示名稱
      description: 請填你希望在 SITCON Credits 上公開顯示的名稱，例如暱稱、中文名或英文名；這不是身份驗證資料。
      placeholder: SITCON 夥伴
    validations:
      required: true
  - type: textarea
    id: bio
    attributes:
      label: 公開簡介
      description: 可以留空。請填你自願公開的一句到幾句簡短介紹。
      placeholder: 曾參與 SITCON 相關活動，關心學生社群與開源協作。
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ### 頭像

        可以全部留空；系統會預設使用你 GitHub 帳號的公開頭像。如果想更換頭像，建議先更新 GitHub 帳號的大頭貼。
  - type: input
    id: avatar_url
    attributes:
      label: 進階：公開頭像圖片 URL
      description: 可以留空。若填寫，請提供你願意公開使用的 https:// 圖片網址；不要填私人相簿、需要登入才能看的圖片，或你不確定授權的圖片。
      placeholder: https://example.com/avatar.png
    validations:
      required: false
  - type: input
    id: public_email
    attributes:
      label: 公開 email
      description: 可以留空。只有願意讓這個 email 公開顯示、被搜尋引擎或第三方保存時才填。
      placeholder: public@example.com
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ### 公開連結

        以下欄位都可以留空。請只填你本人願意公開的 `https://` 連結；最多會接受 8 筆公開連結。
  - type: input
    id: link_github
    attributes:
      label: GitHub
      placeholder: https://github.com/octocat
    validations:
      required: false
  - type: input
    id: link_website
    attributes:
      label: 個人網站
      placeholder: https://example.com
    validations:
      required: false
  - type: input
    id: link_blog
    attributes:
      label: Blog
      placeholder: https://blog.example.com
    validations:
      required: false
  - type: input
    id: link_instagram
    attributes:
      label: Instagram
      placeholder: https://www.instagram.com/octocat
    validations:
      required: false
  - type: input
    id: link_telegram
    attributes:
      label: Telegram
      placeholder: https://t.me/octocat
    validations:
      required: false
  - type: input
    id: link_linkedin
    attributes:
      label: LinkedIn
      placeholder: https://www.linkedin.com/in/octocat
    validations:
      required: false
  - type: input
    id: link_facebook
    attributes:
      label: Facebook
      placeholder: https://www.facebook.com/octocat
    validations:
      required: false
  - type: input
    id: link_youtube
    attributes:
      label: YouTube
      placeholder: https://www.youtube.com/@octocat
    validations:
      required: false
  - type: input
    id: link_slides
    attributes:
      label: Slides
      placeholder: https://speakerdeck.com/octocat
    validations:
      required: false
  - type: input
    id: link_gitlab
    attributes:
      label: GitLab
      placeholder: https://gitlab.com/octocat
    validations:
      required: false
  - type: input
    id: link_discord
    attributes:
      label: Discord
      placeholder: https://discord.com/users/example
    validations:
      required: false
  - type: input
    id: link_mastodon
    attributes:
      label: Mastodon
      placeholder: https://mastodon.social/@octocat
    validations:
      required: false
  - type: input
    id: link_threads
    attributes:
      label: Threads
      placeholder: https://www.threads.net/@octocat
    validations:
      required: false
  - type: input
    id: link_x
    attributes:
      label: X
      placeholder: https://x.com/octocat
    validations:
      required: false
  - type: input
    id: link_custom_label
    attributes:
      label: 自訂連結名稱
      description: 如果上面沒有適合的平台，可以填一個公開顯示名稱；只有填自訂連結 URL 時才需要填。
      placeholder: 個人作品集
    validations:
      required: false
  - type: input
    id: link_custom_url
    attributes:
      label: 自訂連結 URL
      placeholder: https://example.com/portfolio
    validations:
      required: false
  - type: textarea
    id: historical_hints
    attributes:
      label: 我有跳坑過，需要把貢獻紀錄和個人公開資料建立連結（選填）
      description: 如果只是新增或更新個人公開資料，這段可以留空。若你在[公開貢獻紀錄表](https://docs.google.com/spreadsheets/d/1L2drpIE2ocZF3Stba9X0DnLGmYi_igeGWUhaQB_evsQ/edit?gid=517327050#gid=517327050)看到可能是在記錄你本人的資料，可以照下方格式提供線索；這不會自動完成身份合併。
      placeholder: |
        - 活動名稱和年份（event_id）：
        - 目前該列的 github_username：
        ---
        - 活動名稱和年份（event_id）：
        - 目前該列的 github_username：
    validations:
      required: false
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 公開資料確認
      options:
        - label: 我確認這是我自願公開的個人資料。
          required: true
        - label: 我沒有放入私人 email、電話、地址、證件資料或內部聯絡資訊。
          required: true
        - label: 我沒有放入未經本人或他人同意公開的 email 或社群帳號。
          required: true
        - label: 我理解 public_email 會公開顯示在網路上，可能被搜尋引擎、爬蟲或第三方保存。
          required: true
        - label: 我確認這份個人公開資料沒有放入惡意 HTML、JavaScript、刻意破壞頁面顯示的內容，或任何可能造成 SITCON 夥伴困擾的資料；我理解若發生這類行為，維護者可以拒絕信任這次自助提交並改由人工審查。
          required: true
        - label: 我理解這個 PR 不會自動修改 SITCON Credits 的歷史貢獻紀錄，也不會自動完成身份合併。
          required: true
